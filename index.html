<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trader</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .mode-switch {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 4px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #4ade80;
            color: #000;
            box-shadow: 0 4px 12px rgba(74, 222, 128, 0.3);
        }

        .mode-btn:hover:not(.active) {
            color: #fff;
        }
    </style>
</head>

<body>

    <div class="app-wrapper">
        <!-- Main Analysis Area -->
        <div class="main-content">
            <h1><i class="fa-solid fa-robot"></i> BORSA BOTU</h1>

            <div class="mode-switch">
                <button class="mode-btn active" onclick="setMode('hisse')">HİSSE SENEDİ</button>
                <button class="mode-btn" onclick="setMode('fon')">YATIRIM FONU</button>
            </div>

            <div class="input-group">
                <input type="text" id="ticker" placeholder="Hisse Kodu (Örn: GARAN.IS)" autocomplete="off">
                <ul id="suggestions" class="suggestions-list"></ul>
            </div>

            <button onclick="analizEt()" id="btn">ANALİZ ET</button>
            <div class="loading" id="loader">Yapay zeka verileri inceliyor...</div>

            <div id="result-area">
                <div class="header-info">
                    <div class="price" id="price">0.00 TL</div>
                </div>

                <div class="decision-box" id="decision-box">
                    <div class="decision-label">SONUÇ</div>
                    <div class="recommendation-text" id="recommendation-text">--</div>
                </div>

                <div class="risk-container">
                    <span class="risk-label">RİSK ANALİZİ:</span>
                    <span class="risk-value" id="risk-text">--</span>
                    <div class="risk-bar-bg">
                        <div class="risk-bar-fill" id="risk-bar"></div>
                    </div>
                </div>

                <div class="section-title">ÖNGÖRÜLER & STRATEJİ</div>
                <div class="summary-box" id="forecast"></div>

                <div class="section-title">DETAYLAR</div>
                <ul class="key-points" id="key-points"></ul>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Watchlist -->
            <div class="sidebar-card">
                <div class="sidebar-title"><i class="fa-solid fa-eye"></i> Takip Edilenler</div>
                <div class="mini-input-group">
                    <input type="text" class="mini-input" id="watch-input" placeholder="Kod Ekle...">
                    <button class="mini-btn" onclick="addToWatchlist()"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul class="item-list" id="watchlist-ul">
                    <!-- Items will go here -->
                </ul>
            </div>

            <!-- Portfolio -->
            <div class="sidebar-card">
                <div class="sidebar-title"><i class="fa-solid fa-briefcase"></i> Portfolyo</div>
                <div class="mini-input-group">
                    <input type="text" class="mini-input" id="port-input" placeholder="Varlık Ekle...">
                    <button class="mini-btn" onclick="addToPortfolio()"><i class="fa-solid fa-plus"></i></button>
                </div>
                <ul class="item-list" id="portfolio-ul">
                    <!-- Items will go here -->
                </ul>
                <button class="analyze-portfolio-btn" onclick="analyzePortfolio()">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> PORTFOLYOYU ANALİZ ET
                </button>
            </div>
        </div>
    </div>

    <script>
        let activeMode = 'hisse';

        // --- Data ---
        const stocks = [
            { code: "THYAO.IS", name: "Türk Hava Yolları" },
            { code: "GARAN.IS", name: "Garanti BBVA" },
            { code: "AKBNK.IS", name: "Akbank" },
            { code: "EREGL.IS", name: "Erdemir" },
            { code: "SISE.IS", name: "Şişecam" },
            { code: "ASELS.IS", name: "Aselsan" },
            { code: "KCHOL.IS", name: "Koç Holding" },
            { code: "SAHOL.IS", name: "Sabancı Holding" },
            { code: "TCELL.IS", name: "Turkcell" },
            { code: "BIMAS.IS", name: "BİM Mağazaları" },
            { code: "TUPRS.IS", name: "Tüpraş" },
            { code: "YKBNK.IS", name: "Yapı Kredi" },
            { code: "ISCTR.IS", name: "İş Bankası (C)" },
            { code: "PETKM.IS", name: "Petkim" }
        ];

        const funds = [
            { code: "TTE", name: "İş Portföy Teknoloji Karma Fon" },
            { code: "AFT", name: "Ak Portföy Yeni Teknolojiler" },
            { code: "YAS", name: "Yapı Kredi Koç Holding Fonu" },
            { code: "IPB", name: "İstanbul Portföy Birinci Değişken" },
            { code: "MAC", name: "Marmara Capital H.S. Fonu" },
            { code: "TI2", name: "İş Portföy Teknoloji" },
            { code: "HKH", name: "Hedef Portföy Katılım" }
        ];

        // --- Init ---
        loadLists();

        // --- Sidebar Logic ---
        function loadLists() {
            const watch = JSON.parse(localStorage.getItem('watchlist')) || [];
            const port = JSON.parse(localStorage.getItem('portfolio')) || [];
            renderList('watchlist-ul', watch, 'watchlist');
            renderList('portfolio-ul', port, 'portfolio');
        }

        function renderList(elementId, data, storageKey) {
            const ul = document.getElementById(elementId);
            ul.innerHTML = '';
            data.forEach(item => {
                const li = document.createElement('li');
                li.className = 'list-item';
                li.innerHTML = `
                    <span onclick="analyzeSpecific('${item}')">${item}</span>
                    <i class="fa-solid fa-trash delete-btn" onclick="removeFromList('${storageKey}', '${item}')"></i>
                `;
                ul.appendChild(li);
            });
        }

        function addToList(storageKey, inputId) {
            const input = document.getElementById(inputId);
            const val = input.value.toUpperCase().trim();
            if (!val) return;

            const list = JSON.parse(localStorage.getItem(storageKey)) || [];
            if (!list.includes(val)) {
                list.push(val);
                localStorage.setItem(storageKey, JSON.stringify(list));
                loadLists();
            }
            input.value = '';
        }

        function removeFromList(storageKey, item) {
            let list = JSON.parse(localStorage.getItem(storageKey)) || [];
            list = list.filter(i => i !== item);
            localStorage.setItem(storageKey, JSON.stringify(list));
            loadLists();
        }

        function addToWatchlist() { addToList('watchlist', 'watch-input'); }
        function addToPortfolio() { addToList('portfolio', 'port-input'); }

        function analyzeSpecific(code) {
            document.getElementById('ticker').value = code;
            // Mode guess
            if (code.includes('.IS')) setMode('hisse');
            else setMode('fon'); // Basit varsayım
            analizEt();
        }

        // --- Main Logic ---

        function setMode(mode) {
            activeMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active'); // This might fail if called from script, but okay for click

            const input = document.getElementById('ticker');
            if (mode === 'hisse') {
                input.placeholder = "Hisse Kodu (Örn: GARAN.IS)";
                // Manually toggle active class if called via script
                document.querySelectorAll('.mode-btn')[0].classList.add('active');
                document.querySelectorAll('.mode-btn')[1].classList.remove('active');
            } else {
                input.placeholder = "Fon Kodu (Örn: TTE)";
                document.querySelectorAll('.mode-btn')[0].classList.remove('active');
                document.querySelectorAll('.mode-btn')[1].classList.add('active');
            }
        }

        async function analizEt() {
            const ticker = document.getElementById('ticker').value;
            runAnalysis(ticker, activeMode);
        }

        async function runAnalysis(ticker, mode) {
            const loader = document.getElementById('loader');
            const resultArea = document.getElementById('result-area');
            const btn = document.getElementById('btn');

            if (!ticker) { alert("Lütfen bir kod giriniz."); return; }

            resultArea.style.display = 'none';
            loader.style.display = 'block';
            btn.disabled = true;
            btn.innerText = "Yapay Zeka Çalışıyor...";

            try {
                const response = await fetch(`http://127.0.0.1:5000/analiz?hisse=${ticker}&tur=${mode}`);
                const data = await response.json();

                if (data.hata) {
                    alert("Hata: " + data.hata);
                } else {
                    renderSingleResult(data);
                }

            } catch (error) {
                console.error(error);
                alert("Bağlantı hatası!");
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
                btn.innerText = "ANALİZ ET";
            }
        }

        async function analyzePortfolio() {
            const list = JSON.parse(localStorage.getItem('portfolio')) || [];
            if (list.length === 0) { alert("Portfolyo boş!"); return; }

            const loader = document.getElementById('loader');
            const resultArea = document.getElementById('result-area');
            const btn = document.getElementById('btn');

            resultArea.style.display = 'none';
            loader.style.display = 'block';
            btn.disabled = true;
            btn.innerText = "Portfolyo Taranıyor...";

            try {
                const response = await fetch('http://127.0.0.1:5000/portfolio-analiz', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ assets: list })
                });
                const data = await response.json();

                if (data.hata) {
                    alert("Hata: " + data.hata);
                } else {
                    renderPortfolioResult(data);
                }
            } catch (e) {
                console.error(e);
                alert("Hata oluştu.");
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
                btn.innerText = "ANALİZ ET";
            }
        }

        function renderSingleResult(data) {
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('price').innerText = data.fiyat + " TL";

            const rec = data.data.recommendation;
            document.getElementById('recommendation-text').innerText = rec;

            const decisionBox = document.getElementById('decision-box');
            decisionBox.className = 'decision-box';
            if (rec.includes("AL")) decisionBox.classList.add('buy');
            else if (rec.includes("SAT")) decisionBox.classList.add('sell');
            else decisionBox.classList.add('hold');

            document.getElementById('risk-text').innerText = data.data.risk_level;
            const riskScore = data.data.risk_score;
            const riskBar = document.getElementById('risk-bar');
            riskBar.style.width = riskScore + "%";
            riskBar.className = 'risk-bar-fill';
            if (riskScore < 40) riskBar.classList.add('low-risk');
            else if (riskScore < 70) riskBar.classList.add('med-risk');
            else riskBar.classList.add('high-risk');

            document.getElementById('forecast').innerText = data.data.forecast;

            const pointsList = document.getElementById('key-points');
            pointsList.innerHTML = '';
            data.data.key_points.forEach(point => {
                const li = document.createElement('li');
                li.innerHTML = `<i class="fa-solid fa-angle-right"></i> ${point}`;
                pointsList.appendChild(li);
            });
        }

        function renderPortfolioResult(data) {
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('price').innerText = "GENEL SKOR: " + data.general_score + "/100";

            document.getElementById('decision-box').className = 'decision-box'; // Neutral style
            document.getElementById('recommendation-text').innerText = data.diversity_status + " ÇEŞİTLİLİK";

            document.getElementById('risk-text').innerText = data.risk_assessment;
            document.getElementById('risk-bar').style.width = "50%"; // Generic middle
            document.getElementById('risk-bar').className = 'risk-bar-fill med-risk';

            document.getElementById('forecast').innerText = data.strategy_advice;

            const pointsList = document.getElementById('key-points');
            pointsList.innerHTML = '';
            // Portfolyo için özel maddeler
            const li1 = document.createElement('li');
            li1.innerHTML = `<i class="fa-solid fa-star"></i> Yıldız Varlık: ${data.star_asset}`;
            pointsList.appendChild(li1);
        }

        // Suggestions Logic (Same as before)
        const tickerInput = document.getElementById('ticker');
        const suggestionsList = document.getElementById('suggestions');

        tickerInput.addEventListener('input', function () {
            const query = this.value.toLowerCase().trim();
            suggestionsList.innerHTML = '';
            if (query.length === 0) { showAllSuggestions(); return; }
            const sourceList = activeMode === 'hisse' ? stocks : funds;
            const filtered = sourceList.filter(item => item.code.toLowerCase().includes(query) || item.name.toLowerCase().includes(query));
            if (filtered.length > 0) { filtered.forEach(item => addItem(item)); suggestionsList.classList.add('show'); }
            else { suggestionsList.classList.remove('show'); }
        });
        tickerInput.addEventListener('focus', function () { if (this.value.trim() === '') { showAllSuggestions(); } });
        document.addEventListener('click', function (e) { if (!tickerInput.contains(e.target) && !suggestionsList.contains(e.target)) { suggestionsList.classList.remove('show'); } });

        function showAllSuggestions() {
            suggestionsList.innerHTML = '';
            const sourceList = activeMode === 'hisse' ? stocks : funds;
            sourceList.forEach(item => addItem(item));
            suggestionsList.classList.add('show');
        }

        function addItem(item) {
            const li = document.createElement('li');
            li.innerHTML = `<span class="stock-code">${item.code}</span> <span class="stock-name">${item.name}</span>`;
            li.onclick = function () { tickerInput.value = item.code; suggestionsList.classList.remove('show'); };
            suggestionsList.appendChild(li);
        }
    </script>
</body>

</html>
